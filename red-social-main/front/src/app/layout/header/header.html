<header class="navbar">
  <div class="brand">
    <h1>🌐 Red Social</h1>
  </div>

  <!-- Navegación declarativa con routerLink adaptada a la red social -->
  <nav class="nav-links">
    <!-- Pantalla principal de publicaciones (reemplaza a Inicio/Libros) -->
    <a routerLink="/home" routerLinkActive="active">📝 Publicaciones</a>

    @if (authService.currentUser()) {
      <!-- Pantalla de perfil del usuario logueado -->
      <a routerLink="/profile" routerLinkActive="active">👤 Mi Perfil</a>
    }
    
    <!-- Enlaces dinámicos según el estado de autenticación -->
    @if (authService.currentUser()) {
      <a href="#" (click)="logout(); $event.preventDefault()">🚪 Cerrar Sesión</a>
    } @else {
      <a routerLink="/login" routerLinkActive="active">🔑 Iniciar Sesión</a>
    }
  </nav>
</header>
